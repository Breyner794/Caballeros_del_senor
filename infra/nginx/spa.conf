# =============================================================================
#  nginx para las SPA (panel y booking)
#
#  Escucha en 8080 y no en 80 porque la imagen base corre como usuario sin
#  privilegios, y un proceso no-root no puede abrir puertos por debajo de 1024.
#  En Dokploy, al asignar el dominio, el puerto del contenedor es 8080.
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad. Ojo al editar: en nginx, un bloque `location` que
    # declare su propio `add_header` deja de heredar estos. Por eso abajo se usa
    # `expires` en lugar de `add_header Cache-Control`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite pone un hash en el nombre de cada asset, así que el contenido de una
    # URL dada nunca cambia: se puede cachear un año sin riesgo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html sí cambia en cada despliegue, y es quien referencia los assets
    # nuevos. Si el navegador lo cachea, el usuario se queda en la versión vieja.
    location = /index.html {
        expires -1;
    }

    # Sonda para el HEALTHCHECK del contenedor.
    location = /_salud {
        access_log off;
        return 200 "ok\n";
    }

    # Las rutas las resuelve React Router en el cliente, no existen como
    # archivos. Sin este `try_files`, recargar /reservas/abc devuelve un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
